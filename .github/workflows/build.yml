name: Build Modded 8 Ball Pool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool and Signer
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool wget unzip
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Decode Original APK
        run: |
          apktool d apk/base.apk -o decompiled -f

      - name: Inject Mod Library
        run: |
          mkdir -p decompiled/lib/arm64-v8a
          cp mod/lib/arm64-v8a/libmod.so decompiled/lib/arm64-v8a/
          echo "Done injecting mod library."

      - name: Rebuild APK
        run: |
          apktool b decompiled -o unsigned.apk

      - name: Sign and Align APK
        run: |
          java -jar uber-apk-signer-1.3.0.jar --apks unsigned.apk --out signed/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: 8ballpool-mod-v56.35.0
          path: signed/*.apk
